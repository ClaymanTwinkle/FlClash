name: fork-android

# Builds this fork's Android arm64 APK on every push to main, the same way as a
# local build (tool/build_android.sh: pinned submodules, SQLite source, geodata
# and CA bundle), signs it with the fork's release key and publishes it to the
# rolling `android-latest` pre-release, whose asset link never changes:
#   https://github.com/ClaymanTwinkle/FlClash/releases/download/android-latest/FlClash-android-arm64.apk
#
# Secrets: ANDROID_KEYSTORE_B64 (base64 of the PKCS12 keystore), ANDROID_KEY_ALIAS,
# ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-android
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  RELEASE_TAG: android-latest
  ASSET: FlClash-android-arm64.apk

jobs:
  apk:
    if: github.repository == 'ClaymanTwinkle/FlClash'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing" && exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/local.properties

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # versionCode base YYYYMMDDNN, like pubspec.yaml, so every build can update
          # an installed one (the split APK adds its ABI code on top).
          build_number="$(date -u +%Y%m%d)$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))"
          echo "build number $build_number"
          tool/build_android.sh --arch arm64 --build-number "$build_number"

      - name: Check signer
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::the APK is signed with the debug key" && exit 1
          fi
          cp "$apk" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}).
          SHA-256: $(cut -d' ' -f1 "$ASSET.sha256")"
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --prerelease \
              --title "Android (latest main)" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
